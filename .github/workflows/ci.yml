name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Python unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      USERS_DATABASE_URL: postgresql+asyncpg://ping_test:ping_test@127.0.0.1:5432/ping_users_test
      TEST_MONITORING_DATABASE_URL: postgresql+asyncpg://ping_test:ping_test@127.0.0.1:5432/ping_monitoring_test
      USERS_JWT_SECRET: ci-only-very-long-test-secret-do-not-use-in-production-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q services

      - name: Unit tests
        run: |
          if [ -d tests/unit ] && find tests/unit -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest tests/unit -q
          else
            echo "No unit tests yet; skipping."
          fi

      - name: Start PostgreSQL for integration tests (no Docker)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ping_test LOGIN PASSWORD 'ping_test';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ping_users_test OWNER ping_test;"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ping_monitoring_test OWNER ping_test;"

      - name: Integration tests
        run: |
          if [ -d tests/integration ] && find tests/integration -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest tests/integration -q
          else
            echo "No integration tests yet; skipping."
          fi
