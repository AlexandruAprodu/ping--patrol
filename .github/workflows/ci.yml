name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Python unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q services

      - name: Unit tests
        run: |
          if [ -d tests/unit ] && find tests/unit -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest tests/unit -q
          else
            echo "No unit tests yet; skipping."
          fi

      - name: Integration tests
        run: |
          if [ -d tests/integration ] && find tests/integration -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest tests/integration -q
          else
            echo "No integration tests yet; skipping."
          fi
